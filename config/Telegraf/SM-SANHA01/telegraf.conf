# =============================================================================
# Telegraf Configuration for Microsoft Storage Spaces Direct (S2D)
# Cluster: SM-S2DCluster01
# InfluxDB: http://172.22.22.103:8086  Bucket: s2d_sanha
#
# IMPORTANT: Change the node tag below on each node before deploying:
#   SM-SANHA01 -> node = "SM-SANHA01"
#   SM-SANHA02 -> node = "SM-SANHA02"
#   SM-SANHA03 -> node = "SM-SANHA03"
# =============================================================================

[global_tags]
  node    = "SM-SANHA01"
  cluster = "SM-S2DCluster01"
  site    = "SANHA"

# =============================================================================
# AGENT
# =============================================================================
[agent]
  interval             = "30s"
  round_interval       = true
  metric_batch_size    = 5000
  metric_buffer_limit  = 50000
  collection_jitter    = "5s"
  flush_interval       = "30s"
  flush_jitter         = "5s"
  precision            = "1s"
  hostname             = "$COMPUTERNAME"
  omit_hostname        = false
  debug                = false
  quiet                = false
  logfile                       = "C:/telegraf/logs\\telegraf.log"
  logfile_rotation_max_size     = "10MB"
  logfile_rotation_max_archives = 5

# =============================================================================

# -----------------------------------------------------------------------------
# Storage Jobs (active rebalance, repair, optimize jobs)
# -----------------------------------------------------------------------------
[[inputs.exec]]
  commands = ["powershell.exe -NonInteractive -NoProfile -File C:/telegraf/get_storage_jobs.ps1"]
  timeout = "30s"
  data_format = "influx"
  interval = "60s"

# OUTPUT: InfluxDB v2
# =============================================================================
[[outputs.influxdb_v2]]
  urls         = ["http://172.22.22.103:8086"]
  token        = "gIznPpj3KyBxigkTM4PNihoBuUmzuPE43D0DLHqFbiYhwdxD21yxPo2sNc2s5y5h3piCtJ7xRLJmf-cBXade_A=="
  organization = "SmartCloud"
  bucket       = "s2d_sanha"
  timeout      = "15s"
  user_agent   = "telegraf"

# =============================================================================
# INPUT: CPU
# =============================================================================
[[inputs.cpu]]
  percpu           = true
  totalcpu         = true
  collect_cpu_time = false
  report_active    = true
  core_tags        = false

# =============================================================================
# INPUT: Memory
# =============================================================================
[[inputs.mem]]

# =============================================================================
# INPUT: System (uptime)
# =============================================================================
[[inputs.system]]

# =============================================================================
# INPUT: Disk Usage (volumes)
# =============================================================================
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# =============================================================================
# INPUT: Disk I/O
# =============================================================================
[[inputs.diskio]]
  skip_serial_number = false

# =============================================================================
# INPUT: Network (Ethernet + InfiniBand)
# =============================================================================
[[inputs.net]]
  interfaces            = ["Ethernet*", "mlx*", "ib*", "rdma*", "InfiniBand*"]
  ignore_protocol_stats = false

[[inputs.netstat]]

# =============================================================================
# INPUT: Windows Services — S2D Critical Services
# =============================================================================
[[inputs.win_services]]
  service_names = [
    "ClusSvc",
    "StorSvc",
    "spaceport",
    "smphost",
    "WinRM",
    "W32Time",
    "LanmanServer",
    "LanmanWorkstation",
    "RpcSs",
  ]

# =============================================================================
# INPUT: Windows Performance Counters
# =============================================================================
[[inputs.win_perf_counters]]
  PrintValid         = false
  UsePerfCounterTime = true
  PreVistaSupport    = false
  MaxBufferSize      = 131072

  [[inputs.win_perf_counters.object]]
    ObjectName  = "Processor"
    Instances   = ["_Total"]
    Counters    = [
      "% Processor Time",
      "% Idle Time",
      "% Privileged Time",
      "% Interrupt Time",
      "Interrupts/sec",
    ]
    Measurement = "win_cpu"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "Memory"
    Instances   = ["------"]
    Counters    = [
      "Available MBytes",
      "Pages/sec",
      "Page Faults/sec",
      "Pool Nonpaged Bytes",
      "Pool Paged Bytes",
      "Committed Bytes",
      "% Committed Bytes In Use",
    ]
    Measurement = "win_mem"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "PhysicalDisk"
    Instances   = ["*"]
    Counters    = [
      "Disk Read Bytes/sec",
      "Disk Write Bytes/sec",
      "Disk Reads/sec",
      "Disk Writes/sec",
      "Avg. Disk sec/Read",
      "Avg. Disk sec/Write",
      "Avg. Disk sec/Transfer",
      "Avg. Disk Queue Length",
      "Current Disk Queue Length",
      "% Disk Time",
      "% Disk Read Time",
      "% Disk Write Time",
      "Disk Bytes/sec",
      "Disk Transfers/sec",
    ]
    Measurement = "win_physicaldisk"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "LogicalDisk"
    Instances   = ["*"]
    Counters    = [
      "% Free Space",
      "Free Megabytes",
      "Disk Read Bytes/sec",
      "Disk Write Bytes/sec",
      "Disk Reads/sec",
      "Disk Writes/sec",
      "Avg. Disk sec/Read",
      "Avg. Disk sec/Write",
      "Current Disk Queue Length",
    ]
    Measurement = "win_logicaldisk"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "Network Interface"
    Instances   = ["*"]
    Counters    = [
      "Bytes Total/sec",
      "Bytes Received/sec",
      "Bytes Sent/sec",
      "Packets/sec",
      "Packets Received/sec",
      "Packets Sent/sec",
      "Packets Received Errors",
      "Packets Outbound Errors",
      "Current Bandwidth",
      "Output Queue Length",
    ]
    Measurement = "win_net"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "Cluster Storage Hybrid Disks"
    Instances   = ["*"]
    Counters    = [
      "Cache Hit Reads/sec",
      "Cache Miss Reads/sec",
      "Cache Hit Writes/sec",
      "Cache Miss Writes/sec",
      "Cache Full Writes/sec",
      "Cache Destage Reads/sec",
      "Cache Destage Writes/sec",
      "I/O per second",
      "Read/sec",
      "Write/sec",
      "Throughput (Bytes/sec)",
      "Read Throughput (Bytes/sec)",
      "Write Throughput (Bytes/sec)",
      "Avg. I/O Latency (ms)",
      "Read Latency (ms)",
      "Write Latency (ms)",
    ]
    Measurement = "s2d_hybrid_disk"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "Cluster Storage Spaces Virtual Disk"
    Instances   = ["*"]
    Counters    = [
      "Read/sec",
      "Write/sec",
      "Throughput (Bytes/sec)",
      "Read Throughput (Bytes/sec)",
      "Write Throughput (Bytes/sec)",
      "Avg. I/O Latency (ms)",
      "Read Latency (ms)",
      "Write Latency (ms)",
    ]
    Measurement = "s2d_virtual_disk"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "Cluster CSV File System"
    Instances   = ["*"]
    Counters    = [
      "Reads/sec",
      "Writes/sec",
      "Read Bytes/sec",
      "Write Bytes/sec",
      "Read Latency",
      "Write Latency",
      "Avg. sec/Read",
      "Avg. sec/Write",
      "Flushes/sec",
      "Avg. sec/Flush",
    ]
    Measurement = "s2d_csv"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "RDMA Activity"
    Instances   = ["*"]
    Counters    = [
      "RDMA Inbound Bytes/sec",
      "RDMA Outbound Bytes/sec",
      "RDMA Accepted Connections",
      "RDMA Active Connections",
      "RDMA Failed Connection Attempts",
      "RDMA Completion Queue Errors",
    ]
    Measurement = "s2d_rdma"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "SMB Direct Connection"
    Instances   = ["*"]
    Counters    = [
      "Bytes Received/sec",
      "Bytes Sent/sec",
      "Receives Posted/sec",
      "Sends/sec",
      "Send Requests Queued/sec",
    ]
    Measurement = "s2d_smb_direct"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "SMB Server Shares"
    Instances   = ["*"]
    Counters    = [
      "Avg. sec/Request",
      "Avg. sec/Read",
      "Avg. sec/Write",
      "Requests/sec",
      "Read Bytes/sec",
      "Write Bytes/sec",
      "Reads/sec",
      "Writes/sec",
    ]
    Measurement = "s2d_smb_shares"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "System"
    Instances   = ["------"]
    Counters    = [
      "System Up Time",
      "Context Switches/sec",
      "Processor Queue Length",
      "Processes",
      "Threads",
    ]
    Measurement = "win_system"

  [[inputs.win_perf_counters.object]]
    ObjectName  = "Paging File"
    Instances   = ["_Total"]
    Counters    = ["% Usage"]
    Measurement = "win_pagefile"

# =============================================================================
# INPUT: PowerShell — S2D Health via PS1 script files
# All use external .ps1 files to avoid inline escaping issues.
# Each script outputs Influx line protocol, one line per object.
# =============================================================================

# --- Physical Disk Health ---
# Script: C:/telegraf/get_physical_disks.ps1
# Tags: serial, model
# Fields: FriendlyName, HealthStatus, OperationalStatus, MediaType, Usage, SizeGB
[[inputs.exec]]
  commands    = ["powershell.exe -NonInteractive -NoProfile -File C:/telegraf/get_physical_disks.ps1"]
  timeout     = "30s"
  interval    = "60s"
  data_format = "influx"

# --- Virtual Disk Health ---
# Script: C:/telegraf/get_virtual_disks.ps1
# Tags: disk
# Fields: FriendlyName, HealthStatus, OperationalStatus, ResiliencySettingName, SizeGB, FootprintGB
[[inputs.exec]]
  commands    = ["powershell.exe -NonInteractive -NoProfile -File C:/telegraf/get_virtual_disks.ps1"]
  timeout     = "30s"
  interval    = "60s"
  data_format = "influx"

# --- Cluster Node Status ---
# Script: C:/telegraf/get_cluster_nodes.ps1
# Tags: cluster_node
# Fields: NodeName, State, NodeWeight
[[inputs.exec]]
  commands    = ["powershell.exe -NonInteractive -NoProfile -File C:/telegraf/get_cluster_nodes.ps1"]
  timeout     = "30s"
  interval    = "60s"
  data_format = "influx"

# --- Cluster Shared Volume (CSV) Status ---
# Script: C:/telegraf/get_csv.ps1
# Outputs JSON, one object per volume
[[inputs.exec]]
commands    = ["powershell.exe -NonInteractive -NoProfile -File C:/telegraf/get_csv.ps1"]
  timeout     = "30s"
  interval    = "60s"
  data_format = "influx"

# --- Storage Pool Health ---
# Script: C:/telegraf/get_storage_pool.ps1
# Tags: pool
# Fields: HealthStatus, OperationalStatus, TotalSizeGB, AllocatedSizeGB
[[inputs.exec]]
  commands    = ["powershell.exe -NonInteractive -NoProfile -File C:/telegraf/get_storage_pool.ps1"]
  timeout     = "30s"
  interval    = "60s"
  data_format = "influx"

# --- S2D Subsystem Health ---
# Script: C:/telegraf/get_subsystem_health.ps1
# Tags: subsystem
# Fields: FriendlyName, HealthStatus, OperationalStatus
[[inputs.exec]]
  commands    = ["powershell.exe -NonInteractive -NoProfile -File C:/telegraf/get_subsystem_health.ps1"]
  timeout     = "30s"
  interval    = "60s"
  data_format = "influx"

# =============================================================================
# INPUT: Internal Telegraf Metrics
# =============================================================================
[[inputs.internal]]
  collect_memstats = true
